# Route name starts with "api_" on purpose: PrestaShopBundle\EventListener\TokenizedUrlsListener
# skips the _token CSRF check for such routes, so the endpoint can be called with a plain GET.
# Employee login is still enforced by PrestaShop\PrestaShop\Adapter\Security\Admin::onKernelRequest.
api_plugin0_core_info:
  path: /worldline/core-info
  methods: [GET]
  defaults:
    _controller: 'Plugin0\Controller\Admin\CoreInfoController::indexAction'
plugin0_configuration:
  path: /worldline/configuration
  methods: [GET, POST]
  defaults:
    _controller: 'Plugin0\Controller\Admin\ConfigurationController::indexAction'
    _legacy_controller: 'AdminPlugin0Configuration'
# Payment methods: lista, dodavanje, izmena, prekidač i brisanje, kao demo rute
# /admin/payment-methods, /create, /{id}/edit, PATCH /{id}/active i DELETE /{id} (ovde sve GET/POST, jer su forme).
plugin0_payment_methods:
  path: /worldline/payment-methods
  methods: [GET]
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::listAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_payment_method_create:
  path: /worldline/payment-methods/create
  methods: [GET, POST]
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::createAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_payment_method_edit:
  path: /worldline/payment-methods/{id}/edit
  methods: [GET, POST]
  requirements:
    id: '[1-9][0-9]{0,17}'
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::editAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_payment_method_active:
  path: /worldline/payment-methods/{id}/active
  methods: [POST]
  requirements:
    id: '[1-9][0-9]{0,17}'
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::setActiveAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_payment_method_delete:
  path: /worldline/payment-methods/{id}/delete
  methods: [POST]
  requirements:
    id: '[1-9][0-9]{0,17}'
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::deleteAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_settings:
  path: /worldline/settings
  methods: [GET, POST]
  defaults:
    _controller: 'Plugin0\Controller\Admin\SettingsController::indexAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_logs:
  path: /worldline/logs
  methods: [GET]
  defaults:
    _controller: 'Plugin0\Controller\Admin\LogsController::indexAction'
    _legacy_controller: 'AdminPlugin0Configuration'
