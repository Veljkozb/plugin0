# Route name starts with "api_" on purpose: PrestaShopBundle\EventListener\TokenizedUrlsListener
# skips the _token CSRF check for such routes, so the endpoint can be called with a plain GET.
# Employee login is still enforced by PrestaShop\PrestaShop\Adapter\Security\Admin::onKernelRequest.
api_plugin0_core_info:
  path: /worldline/core-info
  methods: [GET]
  defaults:
    _controller: 'Plugin0\Controller\Admin\CoreInfoController::indexAction'
plugin0_configuration:
  path: /worldline/configuration
  methods: [GET, POST]
  defaults:
    _controller: 'Plugin0\Controller\Admin\ConfigurationController::indexAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_payment_methods:
  path: /worldline/payment-methods
  methods: [GET]
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::listAction'
    _legacy_controller: 'AdminPlugin0Configuration'
# Pre rute sa {productId}: Symfony uzima prvu rutu koja odgovara, a "enable" bi odgovarao i obrascu productId-ja.
plugin0_payment_method_enable:
  path: /worldline/payment-methods/enable
  methods: [POST]
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::enableAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_payment_method_edit:
  path: /worldline/payment-methods/{productId}
  methods: [GET, POST]
  requirements:
    productId: '[a-z0-9_]+'
  defaults:
    _controller: 'Plugin0\Controller\Admin\PaymentMethodsController::editAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_settings:
  path: /worldline/settings
  methods: [GET, POST]
  defaults:
    _controller: 'Plugin0\Controller\Admin\SettingsController::indexAction'
    _legacy_controller: 'AdminPlugin0Configuration'
plugin0_logs:
  path: /worldline/logs
  methods: [GET]
  defaults:
    _controller: 'Plugin0\Controller\Admin\LogsController::indexAction'
    _legacy_controller: 'AdminPlugin0Configuration'
